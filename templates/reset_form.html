{% extends "base.html" %}
{% block title %}New password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Choose a new password</h4>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">New password</label>
            <input type="password" name="password" class="form-control" minlength="8" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input type="password" name="confirm" class="form-control" minlength="8" required>
          </div>
          <button class="btn btn-primary w-100">Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
